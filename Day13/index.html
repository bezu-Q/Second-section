<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Habesha Eatery Restaurant">
    <title>Habesha Eatery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Habesha Eatery</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>

<section>
    <h2>About Us</h2>

    <p>
        Welcome to Habesha Eatery. We serve traditional Ethiopian food in a
        comfortable and friendly environment.
    </p>
</section>

<section>

<h2>Reservation Form</h2>

<form>

<label for="name">Name</label><br>
<input type="text" id="name" required><br><br>

<label for="email">Email</label><br>
<input type="email" id="email" required><br><br>

<label for="date">Reservation Date</label><br>
<input type="date" id="date" required><br><br>

<button type="submit">Reserve</button>

</form>

</section>

<section>

<h2>Menu</h2>

<table>

<caption>Menu Prices</caption>

<tr>
<th scope="col">Food</th>
<th scope="col">Price (ETB)</th>
</tr>

<tr>
<td>Doro Wat</td>
<td>350</td>
</tr>

<tr>
<td>Tibs</td>
<td>300</td>
</tr>

<tr>
<td>Shiro</td>
<td>200</td>
</tr>

</table>

</section>

<section>

<h2>Our Restaurant</h2>

<figure>

<img src="food.jpg" alt="Traditional Ethiopian food">

<figcaption>
Traditional Ethiopian dishes served at Habesha Eatery.
</figcaption>

</figure>

<h3>Location</h3>

<iframe
title="Habesha Eatery Location"
src="https://maps.google.com/maps?q=Addis%20Ababa&output=embed"
width="300"
height="200">
</iframe>

</section>

</main>

<footer>

<p>Bole, Addis Ababa, Ethiopia</p>

</footer>

</body>
</html>
