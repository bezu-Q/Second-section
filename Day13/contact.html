<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Habesha Eatery">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<h1>Contact Us</h1>

<nav>
    <a href="index.html">Home</a>
    <a href="contact.html">Contact</a>
</nav>

</header>

<main>

<section>

<h2>Contact Form</h2>

<form>

<label for="fullname">Name</label><br>
<input type="text" id="fullname" required><br><br>

<label for="email">Email</label><br>
<input type="email" id="email" required><br><br>

<label for="message">Message</label><br>
<textarea id="message" rows="5" required></textarea><br><br>

<button type="submit">Send</button>

</form>

</section>

<section>

<h2>Opening Hours</h2>

<table>

<caption>Opening Hours</caption>

<tr>
<th scope="col">Day</th>
<th scope="col">Hours</th>
</tr>

<tr>
<td>Monday - Friday</td>
<td>9 AM - 8 PM</td>
</tr>

<tr>
<td>Saturday</td>
<td>10 AM - 6 PM</td>
</tr>

<tr>
<td>Sunday</td>
<td>Closed</td>
</tr>

</table>

</section>

</main>

<footer>

<p>Email: info@habeshaeatery.com</p>

</footer>

</body>
</html>
